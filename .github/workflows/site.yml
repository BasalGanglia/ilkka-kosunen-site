name: Site CI and manual deployment
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_to_cloudflare:
        description: 'Deploy verified artifact to Cloudflare Pages (requires production secrets)'
        required: true
        type: boolean
        default: false
      target_environment:
        description: 'Cloudflare Pages target (production = main branch, preview = staging branch)'
        required: true
        type: choice
        options:
          - production
          - preview
        default: production

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Run typecheck, tests, and static build
        run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_to_cloudflare == true && github.ref == 'refs/heads/main'
    needs: verify
    environment: ${{ inputs.target_environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-${{ inputs.target_environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deployment CLI
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Deploy verified artifact to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          TARGET_ENV: ${{ inputs.target_environment }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CF_PAGES_PROJECT"
          if [ "$TARGET_ENV" = "production" ]; then
            BRANCH_ARG="main"
          else
            BRANCH_ARG="preview"
          fi
          npx --no-install wrangler pages deploy dist --project-name="$CF_PAGES_PROJECT" --branch="$BRANCH_ARG"
